<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes, viewport-fit=cover">
<title>JelajahLusi | Media Pembelajaran</title>
<meta name="description" content="Ayo mainkan JelajahLusi! Petualangan seru menanti Anda. Mainkan langsung di browser tanpa perlu install.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jelajahlusi.my.id/">
<meta property="og:title" content="JelajahLusi | Media Pembelajaran">
<meta property="og:description" content="Ayo mainkan JelajahLusi! Petualangan seru menanti Anda. Mainkan langsung di browser tanpa perlu install.">
<meta property="og:image" content="https://jelajahlusi.my.id/thumbnail.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="https://jelajahlusi.my.id/">
<meta name="twitter:title" content="JelajahLusi | Media Pembelajaran">
<meta name="twitter:description" content="Ayo mainkan JelajahLusi! Petualangan seru menanti Anda. Mainkan langsung di browser tanpa perlu install.">
<meta name="twitter:image" content="https://jelajahlusi.my.id/thumbnail.jpg">
<link rel="shortcut icon" href="logo.png">
<link rel="stylesheet" href="TemplateData/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#9fc7d5; --sky-deep:#6fa5b8; --mud:#995d3b; --mud-light:#d49878;
  --ink:#4a1212; --mauve:#a9787f; --cream:#fff6ec;
}
*{box-sizing:border-box}
body{margin:0;padding:0;font-family:"Baloo 2",Arial,sans-serif;background:#fff;overflow:hidden}

.main-layout{width:100%;max-width:960px;height:100vh;margin:0 auto;display:flex;align-items:center;justify-content:center}
#unity-container{position:relative!important;top:auto!important;left:auto!important;transform:none!important;background:#222;
  box-shadow:0 10px 30px rgba(74,18,18,.35);width:100%!important;height:auto!important;aspect-ratio:16/9;max-height:100vh;overflow:hidden}
#unity-canvas{width:100%!important;height:100%!important;display:block}

/* ---------- Overlay ---------- */
.overlay-screen{position:fixed;inset:0;z-index:9998;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:16px;color:var(--ink);overflow:hidden;
  background:#fff}
.overlay-screen.hide{opacity:0;pointer-events:none;transition:opacity .5s}
#resume-overlay{display:none}

/* gelembung lumpur */
.bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bubbles i{position:absolute;bottom:-60px;border-radius:50%;background:var(--mud-light);opacity:.45;animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-115vh) translateX(var(--dx,20px));opacity:0}}

/* logo */
.logo-wrap{position:relative;width:min(34vh,230px);aspect-ratio:1;cursor:pointer;perspective:600px;-webkit-tap-highlight-color:transparent;z-index:2}
.logo-wrap img{width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;
  filter:drop-shadow(0 12px 0 rgba(74,18,18,.18));transition:transform .15s ease-out;transform-origin:50% 90%;
  animation:float 3.2s ease-in-out infinite}
.logo-wrap.squish img{animation:squish .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes float{50%{transform:translateY(-8px) rotate(-2deg)}}
@keyframes squish{0%{transform:scale(1,1)}25%{transform:scale(1.25,.7)}55%{transform:scale(.85,1.2)}100%{transform:scale(1,1)}}
.shadow{width:55%;height:14px;margin:-6px auto 0;border-radius:50%;background:rgba(74,18,18,.15);animation:sh 3.2s ease-in-out infinite;filter:blur(3px)}
@keyframes sh{50%{transform:scale(.82);opacity:.6}}

.bubble-say{position:absolute;top:-6px;left:100%;margin-left:6px;white-space:nowrap;background:var(--cream);color:var(--ink);
  font-weight:700;font-size:.95rem;padding:6px 14px;border-radius:18px 18px 18px 4px;box-shadow:0 4px 0 rgba(74,18,18,.15);
  transform:scale(0);transform-origin:0 100%;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.bubble-say.show{transform:scale(1)}

.spark{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:10000;animation:pop .7s ease-out forwards}
@keyframes pop{to{transform:translate(var(--x),var(--y)) scale(0);opacity:0}}

h1{margin:10px 0 0;font-size:clamp(2rem,9vh,3.4rem);font-weight:800;line-height:1;letter-spacing:.5px;color:var(--ink);
  text-shadow:0 3px 0 var(--mud-light)}
.tag{margin:4px 0 14px;font-size:clamp(.9rem,2.6vh,1.1rem);color:#7a4a35;font-weight:500}

/* bar lumpur */
.mudbar{width:min(80vw,360px);height:22px;border-radius:20px;background:#f4e9e0;border:3px solid var(--ink);overflow:hidden;position:relative;margin-bottom:16px}
.mudbar span{position:absolute;inset:0 auto 0 0;width:0%;background:repeating-linear-gradient(45deg,var(--mud) 0 12px,#ad6c47 12px 24px);
  background-size:34px 34px;animation:slide 1s linear infinite;transition:width .25s}
@keyframes slide{to{background-position:34px 0}}

.btn-action{font-family:inherit;background:var(--mud);color:var(--cream);border:3px solid var(--ink);padding:8px 30px;font-size:1.3rem;font-weight:800;
  border-radius:50px;cursor:pointer;display:flex;align-items:center;gap:10px;box-shadow:0 6px 0 var(--ink);transition:transform .12s,box-shadow .12s,background .2s}
.btn-action:hover:not(:disabled){background:#ad6c47;transform:translateY(-2px);box-shadow:0 8px 0 var(--ink)}
.btn-action:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn-action:disabled{background:var(--mauve);cursor:wait;box-shadow:0 6px 0 #6d4a50}
.btn-action:focus-visible,.logo-wrap:focus-visible{outline:4px solid #fff;outline-offset:4px}
.btn-action.ready{animation:wob 1.6s ease-in-out infinite}
@keyframes wob{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

.hint{margin-top:14px;font-size:.85rem;color:#7a4a35}
.credit{position:absolute;bottom:10px;font-size:.78rem;color:#7a4a35;opacity:.85}

/* ---------- Landscape ---------- */
#landscape-warning{display:none}
@media screen and (orientation:portrait){
  .main-layout,.overlay-screen{display:none!important}
  #landscape-warning{display:flex;position:fixed;inset:0;background:#fff;color:var(--ink);z-index:9999;align-items:center;justify-content:center;text-align:center;flex-direction:column;gap:10px;font-size:26px;padding:20px}
  #landscape-warning img{width:110px;animation:float 2.5s ease-in-out infinite}
  #landscape-warning i{font-size:46px;color:var(--mud);animation:spin 2s ease-in-out infinite}
}
@keyframes spin{0%,20%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="landscape-warning">
  <img src="logo.png" alt="Logo JelajahLusi">
  <i class="fa-solid fa-mobile-screen"></i>
  <strong>Putar layar dulu, ya!</strong>
  <span style="font-size:16px;font-weight:500;color:#7a4a35">Game ini dimainkan dalam mode lanskap.</span>
</div>

<div id="welcome-overlay" class="overlay-screen">
  <div class="bubbles" id="bubbles"></div>
  <div class="logo-wrap" id="logo" role="button" tabindex="0" aria-label="Sentuh Lusi">
    <img src="logo.png" alt="Logo JelajahLusi" draggable="false" id="logo-img">
    <div class="bubble-say" id="say">Halo!</div>
  </div>
  <div class="shadow"></div>
  <h1>JelajahLusi</h1>
  <p class="tag">Media pembelajaran interaktif</p>
  <div class="mudbar" aria-hidden="true"><span id="bar"></span></div>
  <button class="btn-action" id="btn-start" disabled><i class="fa-solid fa-spinner fa-spin"></i> Memuat game...</button>
  <div class="hint"><i class="fa-regular fa-hand-pointer"></i> Sentuh Lusi sementara menunggu</div>
  <div class="credit">SMA Kemala Bhayangkari 3</div>
</div>

<div id="resume-overlay" class="overlay-screen">
  <div class="bubbles" id="bubbles2"></div>
  <div class="logo-wrap" style="width:min(26vh,170px)"><img src="logo.png" alt="Logo JelajahLusi" draggable="false"></div>
  <div class="shadow"></div>
  <h1 style="font-size:clamp(1.8rem,7vh,2.6rem)">Game dijeda</h1>
  <p class="tag">Kamu keluar dari layar penuh.</p>
  <button class="btn-action ready" id="btn-resume"><i class="fa-solid fa-play"></i> Lanjutkan</button>
</div>

<div class="main-layout">
  <div id="unity-container" class="unity-desktop">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar"><div id="unity-logo"></div><div id="unity-progress-bar-empty"><div id="unity-progress-bar-full"></div></div></div>
    <div id="unity-warning"></div>
    <div id="unity-footer" style="display:none"></div>
  </div>
</div>

<script>
var canvas = document.querySelector("#unity-canvas");
var myUnityInstance = null;
const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

function unityShowBanner(msg, type) {
  var wb = document.querySelector("#unity-warning");
  if (!wb) return;
  var div = document.createElement('div');
  div.innerHTML = msg;
  wb.appendChild(div);
  if (type == 'error') div.style = 'background:red;padding:10px;color:white;';
  else if (type == 'warning') div.style = 'background:yellow;padding:10px;color:black;';
  setTimeout(function(){ if (div.parentNode) wb.removeChild(div); }, 5000);
}

var buildUrl = "Build";
var loaderUrl = buildUrl + "/jelajahlusi.loader.js";
var config = {
  arguments: [],
  dataUrl: buildUrl + "/jelajahlusi.data",
  frameworkUrl: buildUrl + "/jelajahlusi.framework.js",
  codeUrl: buildUrl + "/jelajahlusi.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "SmaKemalaBhayangkari5",
  productName: "JelajahLusi",
  productVersion: "1.1",
  showBanner: unityShowBanner,
};

if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
  document.querySelector("#unity-container").className = "unity-desktop";
  canvas.className = "unity-desktop";
} else {
  canvas.style.width = "960px";
  canvas.style.height = "540px";
}
document.querySelector("#unity-loading-bar").style.display = "none"; // diganti bar lumpur di layar sambutan

var btnStart = document.getElementById('btn-start');
var bar = document.getElementById('bar');

function showStartError(message) {
  btnStart.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Gagal memuat. Coba lagi';
  btnStart.disabled = false;
  btnStart.onclick = function(){ location.reload(); };
  console.error("[JelajahLusi] Error:", message);
  unityShowBanner("Gagal: " + message, "error");
}

var loadTimeout = setTimeout(function(){
  if (!myUnityInstance) showStartError("Waktu loading habis (5 menit). File terlalu besar atau koneksi lambat.");
}, 300000);

var script = document.createElement("script");
script.src = loaderUrl;
script.async = true;
script.onload = function() {
  if (typeof createUnityInstance !== "function") {
    clearTimeout(loadTimeout);
    return showStartError("File loader.js tidak valid atau path salah.");
  }
  createUnityInstance(canvas, config, function(progress) {
    var p = Math.round(progress * 100);
    bar.style.width = p + "%";
    btnStart.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengunduh ' + p + '%';
  }).then(function(unityInstance) {
    clearTimeout(loadTimeout);
    myUnityInstance = unityInstance;
    bar.style.width = "100%";
    btnStart.innerHTML = '<i class="fa-solid fa-play"></i> Mainkan sekarang';
    btnStart.disabled = false;
    btnStart.classList.add('ready');
    say("Aku siap! Ayo main!");
    burst(logo.getBoundingClientRect());
  }).catch(function(message) {
    clearTimeout(loadTimeout);
    showStartError(message || "Gagal inisialisasi game. Cek console browser.");
  });
};
script.onerror = function() {
  clearTimeout(loadTimeout);
  showStartError("Gagal mengunduh loader.js. Pastikan folder 'Build' ada.");
};
document.body.appendChild(script);

/* ---------- Tombol & layar penuh ---------- */
function enterGame(overlayId) {
  document.getElementById(overlayId).style.display = 'none';
  if (myUnityInstance && !isIOS) myUnityInstance.SetFullscreen(1);
}
btnStart.onclick = function(){ enterGame('welcome-overlay'); };
document.getElementById('btn-resume').onclick = function(){ enterGame('resume-overlay'); };
document.addEventListener('fullscreenchange', function() {
  if (!document.fullscreenElement && document.getElementById('welcome-overlay').style.display === 'none') {
    document.getElementById('resume-overlay').style.display = 'flex';
  }
});

/* ---------- Gelembung lumpur latar ---------- */
['bubbles','bubbles2'].forEach(function(id){
  var box = document.getElementById(id);
  for (var i = 0; i < 16; i++) {
    var b = document.createElement('i'), s = 12 + Math.random() * 40;
    b.style.cssText = 'left:' + Math.random() * 100 + '%;width:' + s + 'px;height:' + s + 'px;animation-duration:' + (7 + Math.random() * 9) +
      's;animation-delay:' + (-Math.random() * 12) + 's;--dx:' + (Math.random() * 60 - 30) + 'px';
    box.appendChild(b);
  }
});

/* ---------- Logo interaktif ---------- */
var logo = document.getElementById('logo'), img = document.getElementById('logo-img'), sayEl = document.getElementById('say');
var lines = ["Halo, aku Lusi!", "Geli, hehe!", "Keren, kan?", "Ayo belajar!", "Jempol buat kamu!", "Siap menjelajah?", "Sstt, tetap tenang~"];
var sayTimer, clicks = 0;

function say(t) {
  sayEl.textContent = t;
  sayEl.classList.add('show');
  clearTimeout(sayTimer);
  sayTimer = setTimeout(function(){ sayEl.classList.remove('show'); }, 1800);
}
function burst(r) {
  var cols = ['#995d3b', '#d49878', '#a9787f', '#ffffff', '#4a1212'];
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('div'), a = Math.random() * 6.28, d = 60 + Math.random() * 70;
    s.className = 'spark';
    s.style.cssText = 'left:' + (r.left + r.width / 2) + 'px;top:' + (r.top + r.height / 2) + 'px;background:' + cols[i % cols.length] +
      ';--x:' + Math.cos(a) * d + 'px;--y:' + Math.sin(a) * d + 'px';
    document.body.appendChild(s);
    setTimeout(function(el){ el.remove(); }, 750, s);
  }
}
function poke() {
  clicks++;
  logo.classList.remove('squish'); void logo.offsetWidth; logo.classList.add('squish');
  burst(logo.getBoundingClientRect());
  say(clicks === 10 ? "Wah, banyak banget!" : lines[Math.floor(Math.random() * lines.length)]);
}
logo.addEventListener('click', poke);
logo.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); poke(); } });

// miring mengikuti kursor / sentuhan
document.getElementById('welcome-overlay').addEventListener('pointermove', function(e) {
  var r = logo.getBoundingClientRect();
  var dx = (e.clientX - (r.left + r.width / 2)) / window.innerWidth;
  var dy = (e.clientY - (r.top + r.height / 2)) / window.innerHeight;
  img.style.animation = 'none';
  img.style.transform = 'rotateY(' + dx * 40 + 'deg) rotateX(' + -dy * 30 + 'deg) translateY(-4px)';
});
document.getElementById('welcome-overlay').addEventListener('pointerleave', function(){ img.style.animation = ''; img.style.transform = ''; });

setTimeout(function(){ say("Halo, aku Lusi!"); }, 600);
</script>
</body>
</html>
